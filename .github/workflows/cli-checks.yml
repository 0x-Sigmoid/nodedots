name: CLI release checks
on:
  workflow_dispatch:
  push:
    paths: ['src/cli/**', 'src/engine/**', 'src/ai/**', 'src/workspace/model.ts', 'packages/cli/**', 'scripts/*cli*', 'package*.json', '.github/workflows/cli-checks.yml']
  pull_request:
    paths: ['src/cli/**', 'src/engine/**', 'src/ai/**', 'src/workspace/model.ts', 'packages/cli/**', 'scripts/*cli*', 'package*.json', '.github/workflows/cli-checks.yml']
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run cli:release-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.os }}-node-${{ matrix.node }}
          path: .wrangler/cli-release/*.tgz
          if-no-files-found: error

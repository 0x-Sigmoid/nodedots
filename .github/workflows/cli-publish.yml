name: Publish CLI
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact packages/cli/package.json version to publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Require main and the exact release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node -e "const p=require('./packages/cli/package.json');if(process.env.GITHUB_REF!=='refs/heads/main'||process.env.REQUESTED_VERSION!==p.version)throw Error('Publish main with its exact package version.');"
  validate:
    needs: guard
    uses: ./.github/workflows/cli-checks.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run cli:build
      - run: npm run cli:smoke
      - run: npm publish ./packages/cli --access public --provenance
